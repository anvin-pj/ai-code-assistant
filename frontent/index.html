<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pizza AI Analytics Portal - Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-5xl">✨</span>
            <h2 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-600 to-orange-500 mt-2">Welcome Back</h2>
            <p class="text-gray-500 text-sm mt-1">Access your GenAI analytics control room</p>
        </div>
        
        <div id="alertMessage" class="hidden text-sm p-3 rounded-lg font-semibold text-center mb-4"></div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-2">Username</label>
                <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 transition" required placeholder="e.g., admin">
            </div>
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-2">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 transition" required placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-rose-500 to-orange-500 text-white font-bold rounded-xl shadow-lg hover:from-rose-600 hover:to-orange-600 transition">
                Login
            </button>
        </form>
        
        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-sm text-gray-500">New around here? <a href="signup.html" class="text-rose-500 font-bold hover:underline">Create an Account</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            alertBox.className = "hidden text-sm p-3 rounded-lg font-semibold text-center mb-4";

            // OAuth2 expects standard Form parameters, not raw JSON strings
            const params = new URLSearchParams();
            params.append('username', document.getElementById('username').value);
            params.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('http://127.0.0.1:8001/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                const data = await response.json();

                if (response.ok) {
                    // Set both standard local keys used by dashboard route guards
                    localStorage.setItem('oauthToken', data.access_token);
                    localStorage.setItem('username', document.getElementById('username').value);
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.innerText = data.detail || "Authentication entry parameters rejected.";
                    alertBox.classList.add('bg-red-50', 'text-red-600');
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.innerText = "Network link timed out. Make sure Auth microservice is on Port 8001.";
                alertBox.classList.add('bg-amber-50', 'text-amber-700');
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
