<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusData AI | Intelligence Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060913;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --accent-primary: #f43f5e; /* Rose */
            --accent-secondary: #fb923c; /* Orange */
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            /* Signature Cosmic Sunset Background */
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(244, 63, 94, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(251, 146, 60, 0.08) 0%, transparent 40%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* 🧊 Glass Auth Card */
        .auth-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: authFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }

        .brand-header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* 📡 Dynamic Alert Styles */
        #alertMessage {
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
        }
        .error-alert { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #fda4af; }
        .warn-alert { background: rgba(251, 146, 60, 0.1); border: 1px solid rgba(251, 146, 60, 0.2); color: #fdba74; }

        /* ⌨️ Tech-Themed Form */
        .input-group { margin-bottom: 20px; }

        .input-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent-secondary);
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }

        .btn-login:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .footer a { color: var(--accent-primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <h2>NexusData AI</h2>
            <p>Intelligence Portal Access</p>
        </div>

        <div id="alertMessage"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>IDENTIFIER_KEY (USERNAME)</label>
                <input type="text" id="username" placeholder="e.g., admin" required>
            </div>

            <div class="input-group">
                <label>SECURITY_ENCRYPTION (PASSWORD)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Initialize Session</button>
        </form>

        <div class="footer">
            New Entity? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            const loginBtn = document.getElementById('loginBtn');
            
            // UI Reset
            alertBox.style.display = "none";
            alertBox.className = "";
            loginBtn.innerText = "VERIFYING ENCRYPTION...";

            // ⚙️ OAUTH2 FORM LOGIC (MATCHES YOUR ORIGINAL CODE)
            const params = new URLSearchParams();
            params.append('username', document.getElementById('username').value);
            params.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('https://ai-code-assistant-2-piq3.onrender.com/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                
                const data = await response.json();

                if (response.ok) {
                    // Standard keys for your dashboard guards
                    localStorage.setItem('oauthToken', data.access_token);
                    localStorage.setItem('username', document.getElementById('username').value);
                    window.location.href = 'dashboard.html';
                } else {
                    alertBox.innerText = data.detail || "Authentication entry parameters rejected.";
                    alertBox.classList.add('error-alert');
                    alertBox.style.display = "block";
                    loginBtn.innerText = "Initialize Session";
                }
            } catch (err) {
                alertBox.innerText = "Network Link Failure: Auth microservice timed out.";
                alertBox.classList.add('warn-alert');
                alertBox.style.display = "block";
                loginBtn.innerText = "Initialize Session";
            }
        });
    </script>
</body>
</html>
