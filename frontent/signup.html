<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Analytics Portal - Create Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-5xl">🚀</span>
            <h2 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-rose-600 to-orange-500 mt-2">Register Profile</h2>
            <p class="text-gray-500 text-sm mt-1">Create Your User Access</p>
        </div>
        
        <div id="alertMessage" class="hidden text-sm p-3 rounded-lg font-semibold text-center mb-4"></div>
        
        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-2">Create Username</label>
                <input type="text" id="username" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 transition" required placeholder="Choose user handle">
            </div>
            <div>
                <label class="block text-gray-700 text-xs font-bold uppercase tracking-wider mb-2">Configure Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 transition" required placeholder="Create secure code">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-rose-500 to-orange-500 text-white font-bold rounded-xl shadow-lg hover:from-rose-600 hover:to-orange-600 transition">
                Register Account
            </button>
        </form>
        
        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-sm text-gray-500">Already registered? <a href="index.html" class="text-rose-500 font-bold hover:underline">Log In directly</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            alertBox.className = "hidden text-sm p-3 rounded-lg font-semibold text-center mb-4";

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('http://127.0.0.1:8001/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (response.ok) {
                    alertBox.innerText = "Registration complete! Routing to security gates...";
                    alertBox.classList.add('bg-green-50', 'text-green-600');
                    alertBox.classList.remove('hidden');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    alertBox.innerText = data.detail || "Sign up allocation failed.";
                    alertBox.classList.add('bg-red-50', 'text-red-600');
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.innerText = "Network mapping error encountered connecting to Port 8001.";
                alertBox.classList.add('bg-amber-50', 'text-amber-700');
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
