<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusData AI | Entity Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060913;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --accent-purple: #8b5cf6; /* Distinct Purple for Signup */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            /* Purple-shifted Cosmic Background */
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(244, 63, 94, 0.08) 0%, transparent 40%);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* 🧊 Glass Auth Card */
        .auth-card {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: authFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }

        .brand-header p {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        /* 📡 Status Feedback Alerts */
        #alertMessage {
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-family: 'JetBrains Mono', monospace;
        }
        .success-alert { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; }
        .error-alert { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #fda4af; }
        .warn-alert { background: rgba(251, 146, 60, 0.1); border: 1px solid rgba(251, 146, 60, 0.2); color: #fdba74; }

        /* ⌨️ Tech-Themed Form */
        .input-group { margin-bottom: 18px; }

        .input-group label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--accent-purple);
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--accent-purple), #6366f1);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-signup:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .footer a { color: var(--accent-purple); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <h2>NexusData AI</h2>
            <p>New Entity Registration</p>
        </div>

        <div id="alertMessage"></div>

        <form id="signupForm">
            <div class="input-group">
                <label>IDENTIFIER_NAME (CREATE USERNAME)</label>
                <input type="text" id="username" placeholder="Choose user handle" required>
            </div>

            <div class="input-group">
                <label>ENCRYPTION_KEY (CONFIGURE PASSWORD)</label>
                <input type="password" id="password" placeholder="Create secure code" required>
            </div>

            <button type="submit" class="btn-signup" id="signupBtn">Authorize Account</button>
        </form>

        <div class="footer">
            Existing Entity? <a href="index.html">Log In directly</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            const signupBtn = document.getElementById('signupBtn');
            
            // UI Reset
            alertBox.style.display = "none";
            alertBox.className = "";
            signupBtn.innerText = "AUTHORIZING ENTITY...";

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                // ⚙️ FETCH LOGIC (MATCHES YOUR ORIGINAL CODE)
                const response = await fetch('https://ai-code-assistant-2-piq3.onrender.com/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();

                if (response.ok) {
                    alertBox.innerText = "Registration complete! Routing to security gates...";
                    alertBox.classList.add('success-alert');
                    alertBox.style.display = "block";
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    alertBox.innerText = data.detail || "Sign up allocation failed.";
                    alertBox.classList.add('error-alert');
                    alertBox.style.display = "block";
                    signupBtn.innerText = "Authorize Account";
                }
            } catch (err) {
                alertBox.innerText = "Network Mapping Error: Auth microservice unreachable.";
                alertBox.classList.add('warn-alert');
                alertBox.style.display = "block";
                signupBtn.innerText = "Authorize Account";
            }
        });
    </script>
</body>
</html>
